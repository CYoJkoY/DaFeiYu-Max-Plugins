name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Validate manifests and index
        run: node scripts/validate.ts
      - name: Rebuild every plug-in from source and compare
        run: node scripts/build-plugin.ts --check
      - name: Run the plug-in tests
        run: node scripts/test-plugin.ts
      - name: Confirm index.json matches the modules
        run: node scripts/build-index.ts --check
