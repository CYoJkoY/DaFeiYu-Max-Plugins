name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Validate manifests and index
        run: node scripts/validate.ts
      - name: Rebuild index and confirm no drift
        run: node scripts/build-index.ts
      - name: Fail on index drift
        shell: bash
        run: |
          if ! git diff --exit-code -- index.json; then
            echo "::error::index.json 与仓库内容不一致，请先运行 node scripts/build-index.ts 提交。"
            exit 1
          fi